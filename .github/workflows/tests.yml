name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The oldest and newest Pythons that torch supports (piazzi requires torch 2.15, which needs 3.11).
        python-version: ["3.11", "3.15"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      # CPU-only torch wheels keep the job small.
      - run: uv venv && uv pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: uv pip install -e . --group dev
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync pytest -q

  # The lowest versions pyproject.toml allows for every direct dependency (torch, SciPy, torchsparsegradutils,
  # pytest), on the oldest Python: the declared floors must actually work.
  test-lowest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      # The torch floor from the CPU index first; the lowest-direct resolution then keeps it.
      - run: uv venv && uv pip install "torch==2.15.0" --index-url https://download.pytorch.org/whl/cpu
      - run: uv pip install --resolution lowest-direct -e ".[scipy,sparse]" --group dev
      - run: uv pip list
      - run: uv run --no-sync pytest -q

  # Only the required dependencies: the tests of the optional extras (SciPy, sparse CG) must skip.
  test-minimal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv venv && uv pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: uv pip install -e . pytest numpy
      - run: uv run --no-sync pytest -q

  notebooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv venv && uv pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: uv pip install -e . --group notebooks
      # The bundle adjustment data, downloaded once rather than from its host on every run.
      - uses: actions/cache@v4
        with:
          path: notebooks/problem-49-7776-pre.txt.bz2
          key: bal-ladybug-49-7776
      # Fails on any error, warning or other stderr output in a cell. --smoke caps the iterations of the slow
      # notebooks: this job checks that they run, not that the solvers converge.
      - run: uv run --no-sync python scripts/execute_notebooks.py --smoke
