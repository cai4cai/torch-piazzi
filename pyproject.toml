[project]
name = "piazzi"
dynamic = ["version"]
description = "Deterministic PyTorch solvers for nonlinear fitting problems: L-BFGS with Armijo line search, Gauss-Newton, Levenberg-Marquardt."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "CAI4CAI" }]
requires-python = ">=3.11"
dependencies = ["torch>=2.15"]
# Kept in sync with the GitHub repository topics.
keywords = [
    "autodiff",
    "bundle-adjustment",
    "gauss-newton",
    "image-registration",
    "lbfgs",
    "levenberg-marquardt",
    "lie-groups",
    "nonlinear-least-squares",
    "optimization",
    "pose-estimation",
    "python",
    "pytorch",
    "quasi-newton",
    "scipy",
    "se3",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
# Third-party backends, each importable as a piazzi subpackage (e.g. piazzi.scipy).
scipy = ["scipy>=1.11"]
# Gauss-Newton and Levenberg-Marquardt of PyPose (piazzi.pypose).
pypose = ["pypose>=0.9"]
# Iterative sparse solvers (piazzi.cg_solver, the default for a sparse Hessian).
sparse = ["torchsparsegradutils>=0.2.7"]

[project.urls]
Documentation = "https://cai4cai.github.io/torch-piazzi/"
Repository = "https://github.com/cai4cai/torch-piazzi"
Issues = "https://github.com/cai4cai/torch-piazzi/issues"

[dependency-groups]
dev = ["pyright[nodejs]==1.1.414", "pypose>=0.9", "pytest>=8", "ruff==0.17.6", "scipy>=1.11", "torchsparsegradutils>=0.2.7"]
notebooks = [
    "jupyterlab>=4",
    "matplotlib>=3.7",
    "nbclient>=0.10",
    "numpy>=1.24",
    "pypose>=0.9",
    "scipy>=1.11",
    "torchsparsegradutils>=0.2.7",
]
docs = [
    "furo>=2024.8.6",
    "myst-nb>=1.1",
    "myst-parser>=3",
    "pypose>=0.9",
    "scipy>=1.11",
    "sphinx>=7.4",
    "sphinx-copybutton>=0.5.2",
    "sphinx-design>=0.6",
    "torchsparsegradutils>=0.2.7",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/piazzi/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/piazzi"]

[tool.pytest.ini_options]
# src/ is collected for the examples in docstrings (doctests).
testpaths = ["tests", "src"]
addopts = "--doctest-modules"
filterwarnings = ["error"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "D", "RUF", "SIM", "C4", "PT", "NPY"]
# PT018: splitting `assert a and b` in the tests would be churn for little gain.
ignore = ["E702", "PT018"]

[tool.ruff.lint.pydocstyle]
# PyTorch-style docstrings: Google sections with types, ``Default: ...`` (see AGENTS.md).
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Docstring rules apply to the library; tests, scripts, notebooks and the docs config are exempt.
"!src/**" = ["D"]

[tool.pyright]
# Type-check the library loosely (not strict mode, not the tests): see AGENTS.md.
include = ["src"]
typeCheckingMode = "standard"
